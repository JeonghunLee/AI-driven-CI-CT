name: Optional Special Environment Test
on:
  workflow_dispatch:
    inputs:
      test_path:
        description: pytest path for the special hardware/environment test
        required: true
        default: test_envs/tests/pytest

jobs:
  special-test:
    runs-on: [self-hosted, hw-test]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use project-local virtual environment
        shell: pwsh
        run: |
          if (-not (Test-Path .venv)) { python -m venv .venv }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Run special test
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest "${{ inputs.test_path }}" -s
      - name: Generate Markdown report
        if: always()
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m test_envs.tools.pipeline --docs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-test-${{ github.run_id }}
          path: test_envs/reports/
