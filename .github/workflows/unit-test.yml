name: Unit Test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python -m pytest test_envs/tests/unittest --junitxml=${{ runner.temp }}/unit-junit.xml
      - name: Normalize unit-test result
        if: always()
        run: .venv/bin/python -m test_envs.tools.result_normalizer ${{ runner.temp }}/unit-junit.xml --test-id UNIT-TEST
      - name: Analyze and generate Markdown
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          RUNNER_NAME: ${{ runner.name }}
        run: .venv/bin/python -m test_envs.tools.pipeline --docs --source-review
      - name: Upload unit-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-${{ github.run_id }}
          path: test_envs/reports/
          if-no-files-found: warn
