name: Test request
description: Select and run a CI/CT test
title: "[Test] "
labels: ["test-request"]
body:
  - type: dropdown
    id: test_type
    attributes:
      label: Test Type
      options: ["Unit Test", "pytest / CT"]
    validations: {required: true}
  - type: dropdown
    id: category
    attributes:
      label: Test Category
      options: [Communication, Timing, Functional, Performance, Stability, Regression]
    validations: {required: true}
  - type: dropdown
    id: equipment
    attributes:
      label: Test Equipment
      options: [None, FPGA, Saleae, Digilent]
    validations: {required: true}
  - type: dropdown
    id: interface
    attributes:
      label: Test Interface
      options: [None, USB, UART, JTAG, Network]
    validations: {required: true}
  - type: dropdown
    id: function
    attributes:
      label: Test Function
      options: [Connection, "Read / Write", Timing, Throughput, Latency, Stability, Custom]
    validations: {required: true}
  - type: dropdown
    id: runner
    attributes:
      label: Runner
      options: [Default, Windows, Linux]
    validations: {required: true}
  - type: input
    id: target
    attributes: {label: Target / DUT, placeholder: Optional target identifier}
  - type: textarea
    id: parameters
    attributes: {label: Test Parameter, description: One parameter per line}
  - type: textarea
    id: expected
    attributes: {label: Expected Result}
  - type: textarea
    id: options
    attributes: {label: Additional Option}

