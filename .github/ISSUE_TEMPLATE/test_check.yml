name: Test Environment Check
description: Detect the selected runner's host type, OS, Python, and Ollama status
title: "[TEST-CHECK] "
labels:
  - test-check-runner
body:
  - type: markdown
    attributes:
      value: |
        Select only the runner to inspect. GitHub Actions detects the environment and posts the result to this Issue.

  - type: dropdown
    id: runner
    attributes:
      label: Runner
      options:
        - GitHub-hosted Linux
        - GitHub-hosted Windows
        - Self-hosted HIL Linux
        - Self-hosted HIL Windows
      default: 0
    validations:
      required: true
