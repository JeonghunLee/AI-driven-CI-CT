name: Test Environment Check
description: Detect the selected runner's host type, OS, Python, and Ollama status
title: "[TEST-CHECK] "
labels:
  - test-check-runner
body:
  - type: markdown
    attributes:
      value: |
        Select the test environment and operating system to inspect. GitHub Actions posts the detected values to this Issue.

  - type: dropdown
    id: test_environment
    attributes:
      label: Test Environment
      description: Self-hosted Runner uses GitHub Actions. Local MCP checks the environment directly without a GitHub Self-hosted Runner.
      options:
        - GitHub-hosted Runner
        - Self-hosted Runner
        - Local MCP
      default: 0
    validations:
      required: true

  - type: dropdown
    id: test_os
    attributes:
      label: Operating System
      options:
        - Ubuntu
        - Windows
      default: 0
    validations:
      required: true
