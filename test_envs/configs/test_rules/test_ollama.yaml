version: 1

# Default Ollama MCP workflow: a small, safe end-to-end test.
agent:
  provider: ollama
  model: deepseek-r1:7b

selection:
  pytest:
    mode: selected # all | selected
    test_ids: [CT-UART-001]
    fixture_mode: mock
  unittest:
    mode: selected # all | selected
    scopes: [ct_framework_python]

reports:
  markdown: true
  pandoc: both # none | docx | html | both

execution:
  coverage: none # none | terminal | html
  timeout_seconds: 3600
